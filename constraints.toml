# Deterministic structural constraints for PLAN, DATASET, RUN, COMPARISON.
# Heading `pattern` must match the heading text in artifacts/<KIND>/template.md (without the number).
# `## Table of Contents` is not listed here: `cfs validate` checks it through the TOC validator, as in the SDLC kit.
# `references.<KIND>` without a `coverage` key = optional; `coverage = true` requires the citation, `coverage = false` prohibits it.
# A rule is declared only where the citing kind's template carries the ID placeholder, so `validate-kits` stays warning-free.

