# Constructor Studio canonical kit manifest for studio-kit-core (minimal cut).
# Resource ids double as template variables inside rules files: {plan_template}, {run_rules}, ...

manifest_version = "1.0"

[[kits]]
slug = "studio-kit-core"
name = "studio-kit-core"
version = "0.2.1"

# ── PLAN ────────────────────────────────────────────────────────
[[kits.resources]]
id = "plan_template"
kind = "template"
source = "artifacts/PLAN/template.md"
install_path = "artifacts/PLAN/template.md"
type = "file"
user_modifiable = true
description = "PLAN artifact template (question, dataset, verdict criteria, screening policy, approval)"

[[kits.resources]]
id = "plan_rules"
kind = "other"
source = "artifacts/PLAN/rules.md"
install_path = "artifacts/PLAN/rules.md"
type = "file"
user_modifiable = true
description = "PLAN authoring rules"

# ── DATASET ─────────────────────────────────────────────────────
[[kits.resources]]
id = "dataset_template"
kind = "template"
source = "artifacts/DATASET/template.md"
install_path = "artifacts/DATASET/template.md"
type = "file"
user_modifiable = true
description = "DATASET artifact template (source, acquisition order, axes, normalisation)"

[[kits.resources]]
id = "dataset_rules"
kind = "other"
source = "artifacts/DATASET/rules.md"
install_path = "artifacts/DATASET/rules.md"
type = "file"
user_modifiable = true
description = "DATASET authoring rules"

# ── RUN ─────────────────────────────────────────────────────────
[[kits.resources]]
id = "run_template"
kind = "template"
source = "artifacts/RUN/template.md"
install_path = "artifacts/RUN/template.md"
type = "file"
user_modifiable = true
description = "RUN artifact template (one procedure on one dataset snapshot: candidate spec, settings, licensed assumptions, outputs, own verdict)"

[[kits.resources]]
id = "run_rules"
kind = "other"
source = "artifacts/RUN/rules.md"
install_path = "artifacts/RUN/rules.md"
type = "file"
user_modifiable = true
description = "RUN authoring rules"

# ── COMPARISON ─────────────────────────────────────────────────────
[[kits.resources]]
id = "comparison_template"
kind = "template"
source = "artifacts/COMPARISON/template.md"
install_path = "artifacts/COMPARISON/template.md"
type = "file"
user_modifiable = true
description = "COMPARISON artifact template (candidates on one snapshot: criterion vectors, pairwise dominance, selection, open pairs, hypothesis status updates)"

[[kits.resources]]
id = "comparison_rules"
kind = "other"
source = "artifacts/COMPARISON/rules.md"
install_path = "artifacts/COMPARISON/rules.md"
type = "file"
user_modifiable = true
description = "COMPARISON authoring rules"

# ── agent quick reference (public rule: aggregated into the generated AGENTS.md)
[[kits.resources]]
id = "agents"
kind = "rule"
source = "AGENTS.md"
install_path = "AGENTS.md"
type = "file"
user_modifiable = true
public = true
description = "Agent quick reference: the five artifact kinds, their resources, and navigation rules"

# ── shared principles (loaded by every rules.md via {principles})
[[kits.resources]]
id = "principles"
kind = "other"
source = "principles.md"
install_path = "principles.md"
type = "file"
user_modifiable = true
description = "Cross-cutting invariants P1–P12 shared by PLAN, DATASET, RUN, COMPARISON and LITERATURE rules"

# ── LITERATURE ─────────────────────────────────────────────────────
[[kits.resources]]
id = "literature_template"
kind = "template"
source = "artifacts/LITERATURE/template.md"
install_path = "artifacts/LITERATURE/template.md"
type = "file"
user_modifiable = true
description = "LITERATURE artifact template (one request along one of four strategies: set, sources, verified claims, candidate hypotheses)"

[[kits.resources]]
id = "literature_rules"
kind = "other"
source = "artifacts/LITERATURE/rules.md"
install_path = "artifacts/LITERATURE/rules.md"
type = "file"
user_modifiable = true
description = "LITERATURE authoring rules and gate rules L1-L11"

# ── literature workflow (public skill: the four strategies; name from its frontmatter)
[[kits.resources]]
id = "literature_workflow"
kind = "skill"
source = "workflows/literature.md"
install_path = "workflows/literature.md"
type = "file"
user_modifiable = true
public = true
description = "Literature workflow: related work, subject review by groups, meta-review, experimental data collection, gated by the PLAN's literature mode"

# ── literature scripts (stdlib Python; OpenAlex REST)
[[kits.resources]]
id = "lit_common"
kind = "script"
source = "scripts/lit_common.py"
install_path = "scripts/lit_common.py"
type = "file"
user_modifiable = false
description = "Shared parsing and exclusion matching for lit_run and lit_gate"

[[kits.resources]]
id = "lit_run"
kind = "script"
source = "scripts/lit_run.py"
install_path = "scripts/lit_run.py"
type = "file"
user_modifiable = false
description = "Retrieval half of a literature strategy against OpenAlex; writes the draft LITERATURE"

[[kits.resources]]
id = "lit_gate"
kind = "script"
source = "scripts/lit_gate.py"
install_path = "scripts/lit_gate.py"
type = "file"
user_modifiable = false
description = "Gate for LITERATURE artifacts: rules L1-L11, offline by default, --resolve online, --plan for mode and exclusions"

# ── design pre-registration scripts (stdlib Python; P5)
[[kits.resources]]
id = "design_log"
kind = "script"
source = "scripts/design_log.py"
install_path = "scripts/design_log.py"
type = "file"
user_modifiable = false
description = "Append-only design log for DATASET batches (append) and the pre-call hook that blocks unregistered experiments (hook)"

[[kits.resources]]
id = "design_gate"
kind = "script"
source = "scripts/design_gate.py"
install_path = "scripts/design_gate.py"
type = "file"
user_modifiable = false
description = "Gate for P5 pre-registration: rules D1-D5 against a non-agent acquisitions source and DATASET section 6"

# ── constraints (keep LAST: the artifact bindings below attach to this resource)
[[kits.resources]]
id = "constraints"
kind = "constraints"
source = "constraints.toml"
install_path = "constraints.toml"
type = "file"
user_modifiable = true
description = "Deterministic structural constraints for PLAN, DATASET, RUN, COMPARISON, LITERATURE"

[kits.resources.artifacts.PLAN]
template = "plan_template"
rules = "plan_rules"

[kits.resources.artifacts.DATASET]
template = "dataset_template"
rules = "dataset_rules"

[kits.resources.artifacts.RUN]
template = "run_template"
rules = "run_rules"

[kits.resources.artifacts.COMPARISON]
template = "comparison_template"
rules = "comparison_rules"

[kits.resources.artifacts.LITERATURE]
template = "literature_template"
rules = "literature_rules"
